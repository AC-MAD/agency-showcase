<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunden-Onboarding | LocalWeb Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a13;
      --card-bg: #0d1527;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --accent: #06b6d4;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 36px; }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #60a5fa;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }
    p.sub { color: var(--text-muted); font-size: 15px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      margin-bottom: 24px;
    }
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
      transition: all 0.25s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(34, 197, 94, 0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">🚀 72-Stunden Express-Setup</div>
      <h1>Kunden-Onboarding & Projekt-Start</h1>
      <p class="sub">In 5 Minuten ausgefüllt: Alle Details für die schlüsselfertige Erstellung Ihrer neuen Website.</p>
    </div>

    <form id="onboardingForm" onsubmit="submitOnboarding(event)">
      <!-- 1. Stammdaten -->
      <div class="card">
        <div class="section-title">
          <span>🏢</span> 1. Unternehmens- & Kontaktdaten
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Firmenname / Betrieb *</label>
            <input type="text" name="company" placeholder="z.B. Schmidt Bedachungen GmbH" required>
          </div>
          <div class="form-group">
            <label>Inhaber / Geschäftsführer *</label>
            <input type="text" name="owner" placeholder="z.B. Markus Schmidt" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Straße & Hausnummer *</label>
            <input type="text" name="street" placeholder="z.B. Hauptstraße 42" required>
          </div>
          <div class="form-group">
            <label>PLZ & Stadt *</label>
            <input type="text" name="city" placeholder="z.B. 69115 Heidelberg" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Telefonnummer (für Kunden & Notdienst) *</label>
            <input type="text" name="phone" placeholder="z.B. 06221 / 123456" required>
          </div>
          <div class="form-group">
            <label>Offizielle E-Mail-Adresse *</label>
            <input type="email" name="email" placeholder="z.B. info@schmidt-bedachungen.de" required>
          </div>
        </div>
      </div>

      <!-- 2. Leistungen & Branche -->
      <div class="card">
        <div class="section-title">
          <span>🛠️</span> 2. Leistungen & Schwerpunkte
        </div>
        <div class="form-group">
          <label>Branche / Fachbereich *</label>
          <select name="niche" required>
            <option value="Sanitär & Heizung">Sanitär, Heizung & Klimatechnik</option>
            <option value="Dachdeckerei">Dachdeckerei & Bedachungen</option>
            <option value="Elektrotechnik">Elektrotechnik & Gebäudeautomation</option>
            <option value="Maler & Stuckateur">Maler, Lackierer & Stuckateur</option>
            <option value="Schreinerei & Fensterbau">Schreinerei & Fensterbau</option>
            <option value="Garten- & Landschaftsbau">Garten- & Landschaftsbau</option>
            <option value="Friseur & Beauty Salon">Friseur & Beauty Salon</option>
            <option value="Gastronomie & Restaurant">Gastronomie & Restaurant</option>
            <option value="Arztpraxis & Physiotherapie">Arztpraxis & Physiotherapie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ihre 3 bis 5 wichtigsten Hauptleistungen (eine pro Zeile) *</label>
          <textarea name="services" rows="4" placeholder="z.B.&#10;1. 24h Rohrreinigung & Notdienst&#10;2. Badsanierung aus einer Hand&#10;3. Moderne Wärmepumpen & Heizungstausch&#10;4. Dichtigkeitsprüfung" required></textarea>
        </div>
        <div class="form-group">
          <label>Einsatzgebiet / Städte im Umkreis *</label>
          <input type="text" name="service_area" placeholder="z.B. Heidelberg, Mannheim und 30 km Umkreis" required>
        </div>
      </div>

      <!-- 3. Design & Wunschdomain -->
      <div class="card">
        <div class="section-title">
          <span>🎨</span> 3. Design-Wünsche & Domain
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Bevorzugte Farbwelt</label>
            <select name="color_scheme">
              <option value="Klassisches Handwerker-Blau">Klassisches Handwerker-Blau (#2563eb)</option>
              <option value="Modernes Anthrazit & Cyan">Modernes High-End Anthrazit & Cyan</option>
              <option value="Naturgrün & Wärme">Naturgrün & Wärme (Heizung/Gala)</option>
              <option value="Edles Rot & Weiß">Traditionelles Handwerker-Rot</option>
            </select>
          </div>
          <div class="form-group">
            <label>Wunsch-Domain (falls schon vorhanden oder geplant)</label>
            <input type="text" name="domain" placeholder="z.B. www.schmidt-bedachungen-hd.de">
          </div>
        </div>
        <div class="form-group">
          <label>Link zu Fotos / Logo (z.B. Dropbox, Google Drive, oder Notiz: "Sende ich per WhatsApp")</label>
          <input type="text" name="asset_link" placeholder="z.B. Google Drive Link oder 'per WhatsApp an Ayoub'">
        </div>
        <div class="form-group">
          <label>Besondere Hinweise oder Wünsche</label>
          <textarea name="notes" rows="3" placeholder="z.B. Bitte das 24h Notdienst-Banner besonders hervorheben."></textarea>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        🚀 Onboarding-Daten absenden & Website-Bau starten
      </button>
    </form>
  </div>

  <script>
    async function submitOnboarding(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '⏳ Daten werden übermittelt...';
      btn.disabled = true;

      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        await fetch('https://formsubmit.co/ajax/ac28ayoub@gmail.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            _subject: '🚀 NEUES KUNDEN-ONBOARDING: ' + data.company,
            _cc: 'gonioching@gmail.com',
            ...data,
            Zeitpunkt: new Date().toISOString()
          })
        });
      } catch (err) {}

      document.querySelector('.container').innerHTML = `
        <div class="card" style="text-align: center; padding: 48px 24px; margin-top: 40px;">
          <div style="width: 72px; height: 72px; background: rgba(34, 197, 94, 0.2); border: 2px solid #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 34px; color: #22c55e;">✓</div>
          <h2 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 12px;">Onboarding erfolgreich abgeschlossen!</h2>
          <p style="color: #cbd5e1; font-size: 16px; max-width: 500px; margin: 0 auto 24px; line-height: 1.6;">
            Vielen Dank, <strong>${data.owner}</strong>! Alle Daten für <strong>${data.company}</strong> wurden sicher an unser Entwicklerteam übermittelt.
          </p>
          <div style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 18px; font-size: 14px; color: #cbd5e1; max-width: 440px; margin: 0 auto; text-align: left;">
            ⏱️ <strong>Die nächsten Schritte:</strong><br>
            1. Wir erstellen den Entwurf innerhalb von 24–48 Stunden.<br>
            2. Sie erhalten Ihren persönlichen Live-Vorschau-Link zur Freigabe.<br>
            3. Bei Fragen erreichen Sie Projektleiter Ayoub Chouifi direkt unter ac28ayoub@gmail.com.
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
